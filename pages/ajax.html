<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX — jQuery Lab</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/ajax.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>AJAX — взаимодействие с сервером</h1>
            <nav>
                <a href="../index.html">На главную</a>
            </nav>
        </header>

        <main>
            <section>
                <h2>Загрузка публикаций</h2>

                <p>Получение публикаций с помощью метода $.ajax().</p>

                <button id="loadPostsBtn">Загрузить публикации</button>

                <div id="posts-container">
                    <p>Нажми кнопку, чтобы загрузить публикации.</p>
                </div>
            </section>

            <section>
                <h2>Загрузка пользователей</h2>

                <p>Получение пользователей с помощью метода $.get().</p>

                <button id="loadUsersBtn">Загрузить пользователей</button>

                <div id="users-container"></div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 jQuery Lab</p>
        </footer>
    </div>

    <script src="../js/ajax.js"></script>
</body>
</html>
